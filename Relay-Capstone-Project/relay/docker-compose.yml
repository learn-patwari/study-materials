# One-command local run: Postgres + Relay. Console at http://localhost:8080/
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: relay
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay -d relay"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    environment:
      RELAY_DB_URL: jdbc:postgresql://db:5432/relay
      RELAY_DB_USER: relay
      RELAY_DB_PASSWORD: relay
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

spring:
  application:
    name: relay
  datasource:
    url: ${RELAY_DB_URL:jdbc:postgresql://localhost:5432/relay}
    username: ${RELAY_DB_USER:relay}
    password: ${RELAY_DB_PASSWORD:relay}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

relay:
  engine:
    # How often each worker polls the outbox queue (ms)
    poll-interval-ms: 500
    # Number of worker threads pulling from the outbox
    worker-threads: 2
    # Lease timeout after which an in-flight outbox message is reclaimed (seconds)
    lease-timeout-seconds: 30
  guardrails:
    # Hard cap on steps per run — a guardrail you cannot turn off (v1 constant)
    max-steps: 100
  http-adapter:
    # When true, the mocked HTTP world injects transient failures to exercise retries
    flaky: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

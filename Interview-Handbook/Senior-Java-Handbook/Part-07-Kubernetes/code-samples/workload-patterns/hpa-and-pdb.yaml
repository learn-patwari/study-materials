# HorizontalPodAutoscaler: scales `payments-api` on CPU utilization and a
# custom metric (requests-per-second via an adapter such as
# prometheus-adapter). Two metrics are provided deliberately — CPU alone is
# a lagging indicator for a JVM service (allocation-heavy request spikes
# show up in GC pause / latency before they show up in CPU%), so a
# throughput-based metric usually triggers scale-out earlier.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: payments-api
  namespace: payments
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: payments-api
  minReplicas: 6
  maxReplicas: 30
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300   # avoid flapping: wait 5 min of
                                          # sustained low load before
                                          # scaling down
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60             # scale down at most 2 pods/min
    scaleUp:
      stabilizationWindowSeconds: 0     # scale up immediately, no delay
      policies:
        - type: Pods
          value: 4
          periodSeconds: 30             # allow fast scale-up under load
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    - type: Pods
      pods:
        metric:
          name: http_requests_per_second
        target:
          type: AverageValue
          averageValue: "200"
---
# PodDisruptionBudget: caps how many pods a VOLUNTARY disruption (node
# drain, cluster-autoscaler scale-down, `kubectl drain`) may take down at
# once. This does NOT protect against involuntary disruption (OOMKilled,
# node crash) — only against the cluster's own maintenance operations
# removing too much capacity at once.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: payments-api
  namespace: payments
spec:
  minAvailable: 80%
  selector:
    matchLabels:
      app: payments-api

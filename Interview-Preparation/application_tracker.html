// ── Derived stats ─────────────────────────────────────────────────────────
function computeStats(jobs) {
  const total = jobs.length;
  const applied = jobs.filter(j => j.status === 'applied').length;
  const interviews = jobs.filter(j => j.status === 'interview').length;
  const avgMatch = Math.round(jobs.reduce((a, j) => a + j.match, 0) / jobs.length);
  return { total, applied, interviews, avgMatch };
}

// ── Render ────────────────────────────────────────────────────────────────
let activeFilter = 'all';
let activeFocus = 'all';

function initials(company) {
  return company.split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase();
}

function renderStats() {
  const s = computeStats(JOBS);
  document.getElementById('stats-strip').innerHTML = `
    <div class="stat"><span class="stat-num">${s.total}</span><span class="stat-label">In Pipeline</span></div>
    <div class="stat"><span class="stat-num">${s.applied}</span><span class="stat-label">Applied</span></div>
    <div class="stat"><span class="stat-num">${s.interviews}</span><span class="stat-label">Interviews</span></div>
    <div class="stat"><span class="stat-num">${s.avgMatch}%</span><span class="stat-label">Avg Match</span></div>
  `;
}

function renderControls() {
  const statuses = ['all', 'new', 'applied', 'interview', 'offer', 'rejected'];
  const focuses = ['all', ...new Set(JOBS.map(j => j.focus))];

  const filterBtns = statuses.map(s =>
    `<button class="filter-btn${activeFilter === s ? ' active' : ''}" onclick="setFilter('${s}')">${s.charAt(0).toUpperCase() + s.slice(1)}</button>`
  ).join('');

  const focusOpts = focuses.map(f =>
    `<option value="${f}"${activeFocus === f ? ' selected' : ''}>${f === 'all' ? 'All Focus Types' : f}</option>`
  ).join('');

  document.getElementById('controls-wrap').innerHTML = `
    ${filterBtns}
    <select class="focus-select" onchange="setFocus(this.value)">${focusOpts}</select>
  `;
}

function renderGrid() {
  let jobs = JOBS;
  if (activeFilter !== 'all') jobs = jobs.filter(j => j.status === activeFilter);
  if (activeFocus !== 'all') jobs = jobs.filter(j => j.focus === activeFocus);
  jobs = [...jobs].sort((a, b) => b.match - a.match);

  if (jobs.length === 0) {
    document.getElementById('job-grid').innerHTML = '<div class="empty">No roles match the current filter.</div>';
    return;
  }

  document.getElementById('job-grid').innerHTML = jobs.map(job => {
    const tags = job.tags.slice(0, 5).map(t => `<span class="tag">${t}</span>`).join('');
    const pillClass = `pill-${job.status}`;
    return `
    <div class="card s-${job.status}" id="card-${job.id}">
      <div class="card-body">
        <div class="card-top">
          <div class="company-badge">${initials(job.company)}</div>
          <div class="card-title-block">
            <div class="card-company">${job.company}</div>
            <div class="card-role">${job.role}</div>
          </div>
        </div>
        <div class="card-scores">
          <div class="score-block">
            <div class="score-num">${job.match}<span style="font-size:0.7em;opacity:0.5">%</span></div>
            <div class="score-label">Match</div>
            <div class="score-bar-track"><div class="score-bar-fill" style="width:${job.match}%"></div></div>
          </div>
          <div class="score-block">
            <div class="score-num">${job.ats}<span style="font-size:0.7em;opacity:0.5">%</span></div>
            <div class="score-label">ATS Score</div>
            <div class="score-bar-track"><div class="score-bar-fill" style="width:${job.ats}%;opacity:0.55"></div></div>
          </div>
        </div>
        <div class="card-tags">${tags}</div>
      </div>
      <div class="card-footer">
        <div style="display:flex;gap:0.4rem;align-items:center;flex-wrap:wrap">
          <span class="status-pill ${pillClass}">${job.status}</span>
          <span class="focus-pill">${job.focus}</span>
        </div>
        <div class="card-actions">
          <button class="btn-cl" onclick="toggleCL('${job.id}')">Cover letter</button>
          <a class="btn-apply" href="${job.link}" target="_blank" rel="noopener">Apply &rarr;</a>
        </div>
      </div>
      <div class="cl-panel" id="cl-${job.id}">
        <div class="cl-label">Cover Letter</div>
        <div class="cl-text">${escHtml(job.cl)}</div>
        <button class="cl-copy" onclick="copyCL('${job.id}')">Copy to clipboard</button>
      </div>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function toggleCL(id) {
  const panel = document.getElementById('cl-' + id);
  panel.classList.toggle('open');
  const btn = panel.previousElementSibling.querySelector('.btn-cl');
  if (btn) btn.textContent = panel.classList.contains('open') ? 'Hide letter' : 'Cover letter';
}

function copyCL(id) {
  const job = JOBS.find(j => j.id === id);
  if (!job) return;
  navigator.clipboard.writeText(job.cl).then(() => {
    const btn = document.querySelector(`#cl-${id} .cl-copy`);
    btn.textContent = 'Copied!';
    setTimeout(() => btn.textContent = 'Copy to clipboard', 1800);
  });
}

function setFilter(f) { activeFilter = f; render(); }
function setFocus(f)  { activeFocus = f;  render(); }

function render() {
  renderStats();
  renderControls();
  renderGrid();
}

// ── Theme toggle ──────────────────────────────────────────────────────────
function toggleTheme() {
  const root = document.documentElement;
  const current = root.getAttribute('data-theme');
  const isDark = current === 'dark' || (!current && window.matchMedia('(prefers-color-scheme: dark)').matches);
  root.setAttribute('data-theme', isDark ? 'light' : 'dark');
}

// ── Date ──────────────────────────────────────────────────────────────────
document.getElementById('last-updated').textContent = 'Updated 2026-08-06';
render();
</script>
